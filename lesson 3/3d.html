<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            background-color: rgb(121, 82, 179);
            color: white;
            padding: 15px;
            border: none;
            margin-right: 10px;
            width: 150px;
            border-radius: 10px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-left: 20px;
        }
        .b{
            background-color: white;
            color: grey;
            padding: 15px;
            border: solid grey 2px;
            width: 150px;
            border-radius: 10px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-left: 10px;
        }
        .a:hover{
            cursor: pointer;
            background-color: rgb(98, 47, 173);
            transition: background-color 2s;
        }
        .b:hover{
            cursor: pointer;
            transition: background-color 0.5s;
            background-color: grey;
            color:white ;
            border: none;
        }

    </style>
</head>
<body>
    <button class="a">Get Started</button>
    <button class="b">Download</button>
</body>
</html>
