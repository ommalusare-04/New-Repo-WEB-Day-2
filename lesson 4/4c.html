<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .signup{
            background-color:rgb(64, 164, 79);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight:bolder;
            margin: 40px;
            font-size: 15px;
        }
        .signup:hover{
            cursor: pointer;
            box-shadow: 10px 5px 15px 5px rgba(0, 0, 0, 0.20);
            background-color:rgb(86, 190, 102) ;
            transition: background-color 2s;
        }
    </style>
</head>
<body>
    <button class="signup">Sign Up</button>
</body>
</html>
